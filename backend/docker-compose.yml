services:
  # PostgreSQL is provided as a separate Coolify resource. Both DATABASE_URL
  # and DIRECT_URL must point to that resource; they may use the same URL when
  # the server is not behind a transaction pooler.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Single service — server.ts starts the BullMQ search worker in-process
  # alongside the HTTP server. `npm start` deploys pending migrations before
  # starting either process, so the schema can never lag behind the image.
  api:
    build: .
    restart: unless-stopped
    command: npm start
    ports:
      - '4000:4000'
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
